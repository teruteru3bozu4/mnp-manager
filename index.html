<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#172b4d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>MNP管理</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
:root{color-scheme:light dark;--bg:#f2f4f7;--card:#fff;--text:#202938;--muted:#667085;--line:#d7dde6;--field:#fff;--navy:#172b4d;--green:#137547;--red:#b42318;--shadow:0 2px 10px #172b4d0d}
@media(prefers-color-scheme:dark){:root{--bg:#101722;--card:#192331;--text:#e7edf5;--muted:#a9b5c5;--line:#344153;--field:#111a26;--navy:#e7edf5;--green:#65d69a;--red:#ff8989;--shadow:0 2px 12px #0003}}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:10;background:var(--card);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 12px 10px}.head{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}h1{font-size:22px;margin:0;color:var(--navy)}h2{font-size:18px;color:var(--navy);margin:0 0 12px}h3{font-size:16px;margin:0 0 8px}.wrap{max-width:1200px;margin:14px auto;padding:0 12px}.notice{font-size:12px;color:var(--muted);margin:6px 0}.panel,.metric,.contract{background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}.panel{padding:14px;margin:14px 0}.dash{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.metric{padding:12px}.metric small{display:block;color:var(--muted)}.metric strong{font-size:20px;overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.field{min-width:0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}.field input,.field select,.field textarea,.search input,.search select{width:100%;min-width:0;min-height:44px;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--field);color:var(--text);font:inherit}.field textarea{min-height:75px}.full{grid-column:1/-1}button{min-height:44px;padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--text);font:inherit;font-weight:650;cursor:pointer}button.primary{background:#172b4d;color:#fff;border-color:#172b4d}button.danger{color:var(--red);border-color:var(--red)}button.small{min-height:40px;padding:6px 9px;font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{flex:1 1 auto}.msg{display:none;padding:9px 11px;border-radius:9px;margin:9px 0;font-size:13px}.msg.show{display:block}.error{color:var(--red);background:color-mix(in srgb,var(--red) 12%,var(--card))}.ok{color:var(--green);background:color-mix(in srgb,var(--green) 12%,var(--card))}.info{background:var(--bg)}.search{display:grid;grid-template-columns:1fr 1fr;gap:8px}.cards{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}.contract{padding:15px;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.phone{font-weight:800;font-size:19px;overflow-wrap:anywhere;line-height:1.35}.status{font-size:12px;font-weight:700;padding:3px 7px;border-radius:6px;background:var(--bg);white-space:nowrap}.profit{font-size:22px;font-weight:800;margin:10px 0;padding:8px 10px;border-radius:8px;background:var(--bg)}.positive{color:var(--green)}.negative{color:var(--red)}.details{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.detail{min-width:0;padding:7px 8px;background:var(--bg);border-radius:7px}.detail small{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}.detail div{white-space:pre-wrap;overflow-wrap:anywhere}.wide{grid-column:1/-1}.cardactions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.cardactions button{flex:1 1 calc(50% - 6px);min-width:0}.empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px;grid-column:1/-1}.hidden{display:none!important}.rule{height:1px;background:var(--line);margin:12px 0}.historyitem{padding:12px;border:1px solid var(--line);border-radius:10px;margin:10px 0}.nameitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}.nameitem input{width:100%;min-width:0;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--field);color:var(--text)}footer{max-width:1200px;margin:14px auto;padding:0 12px;color:var(--muted);font-size:12px}
@media(min-width:760px){.wrap{padding:0 18px}.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.dash{grid-template-columns:repeat(4,minmax(0,1fr))}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.search{grid-template-columns:2fr 1fr}.panel{padding:18px}}
</style></head>
<body>
<header><div class="head"><h1>MNP管理</h1><div class="actions" style="margin:0"><button class="small" id="exportTop">CSV出力</button><button class="small" id="importTop">CSV取込</button><input id="csvFile" type="file" accept=".csv,text/csv" class="hidden"></div></div></header>
<main class="wrap">
<div class="notice">データはこの端末・ブラウザ内にのみ保存されます。定期的にCSVでバックアップしてください。</div><div class="notice">解約可能日は目安です。正式な条件・日付は各キャリアで確認してください。</div>
<section class="dash">
<div class="metric"><small>回線数（表示中）</small><strong id="count">0</strong></div><div class="metric"><small>利益合計（履歴含む）</small><strong id="totalProfit">¥0</strong></div><div class="metric"><small>契約中</small><strong id="active">0</strong></div><div class="metric"><small>解約可能・解約済</small><strong id="eligibleCount">0</strong></div>
</section>
<section class="panel" id="formPanel"><h2 id="formTitle">契約を追加</h2><div id="formMsg" class="msg" role="status"></div><div id="rollMsg" class="msg info"></div>
<form id="form" autocomplete="off"><input id="editId" type="hidden"><input id="prevId" type="hidden">
<div class="grid">
<div class="field"><label for="phone">電話番号</label><input id="phone" type="tel" inputmode="numeric" placeholder="090-1234-5678"></div>
<div class="field"><label for="reservation">MNP予約番号（文字列・先頭0保持）</label><input id="reservation" type="text" inputmode="numeric"></div>
<div class="field"><label for="holder">契約者</label><select id="holder"></select><input id="holderNew" class="hidden" placeholder="契約者名を入力"></div>
<div class="field"><label for="user">利用者名</label><select id="user"></select><input id="userNew" class="hidden" placeholder="利用者名を入力"></div>
<div class="field"><label for="from">転出元キャリア</label><select id="from"></select><input id="fromNew" class="hidden" placeholder="転出元キャリアを入力"></div>
<div class="field"><label for="to">転入先キャリア</label><select id="to"></select><input id="toNew" class="hidden" placeholder="転入先キャリアを入力"></div>
<div class="field"><label for="date">契約日</label><input id="date" type="date"></div>
<div class="field"><label for="plan">プラン</label><select id="plan"></select><input id="planNew" class="hidden" placeholder="プランを入力"></div>
<div class="field"><label for="device">端末名</label><input id="device"></div>
<div class="field"><label for="purchase">端末購入価格（円）</label><input id="purchase" type="text" inputmode="numeric"></div>
<div class="field"><label for="sale">端末売却価格（円）</label><input id="sale" type="text" inputmode="numeric"></div>
<div class="field"><label for="fee">事務手数料等（円）</label><input id="fee" type="text" inputmode="numeric"></div>
<div class="field"><label for="monthly">月額料金（円）</label><input id="monthly" type="text" inputmode="numeric"></div>
<div class="field"><label for="cb">特典・CB（円）</label><input id="cb" type="text" inputmode="numeric"></div>
<div class="field"><label for="months">保有月数</label><input id="months" type="text" inputmode="numeric" value="6"></div>
<div class="field"><label for="eligible">解約可能日（目安・自動計算）</label><input id="eligible" readonly></div>
<div class="field"><label for="status">ステータス</label><select id="status"><option>契約中</option><option>解約可能</option><option>解約済</option><option>キャンセル</option></select></div>
<div class="field full"><label for="memo">メモ</label><textarea id="memo"></textarea></div></div>
<div class="notice">利益 ＝ 売却価格 − 購入価格 − 手数料等 ＋ 特典・CB −（月額料金 × 保有月数）</div>
<div class="actions"><button class="primary" type="submit">保存</button><button type="button" id="clearForm">入力をクリア</button></div></form></section>
<section class="panel"><h2>契約一覧</h2><div class="search"><input id="search" type="search" placeholder="電話番号・名前・予約番号・キャリア・端末・プランで検索"><select id="filter"><option value="">すべてのステータス</option><option>契約中</option><option>解約可能</option><option>解約済</option><option>キャンセル</option></select></div><div class="notice">乗り換え元の契約は履歴にまとめられ、通常一覧には現在の契約のみ表示されます。</div><div class="rule"></div><div id="cards" class="cards"></div></section>
<section class="panel hidden" id="historyPanel"><div class="head"><h2>契約履歴</h2><button id="closeHistory" class="small">閉じる</button></div><div id="historyContent"></div></section>
<section class="panel"><h2>データ管理</h2><div class="actions"><button id="namesBtn">名前の管理</button><button id="exportBottom">CSV出力</button><button id="importBottom">CSV取込</button></div><div id="namesPanel" class="hidden"><div class="rule"></div><h3>名前の管理</h3><div id="namesMsg" class="msg"></div><div id="namesList"></div><div class="actions"><button id="closeNames">閉じる</button></div></div></section><div id="globalMsg" class="msg" role="status"></div>
</main><footer>MNP管理 PWA。CSVは定期的に別の場所へ保存してください。</footer>
<script>
'use strict';
const DATA_KEY='mnp_manager_v1',NAMES_KEY='mnp_names_v1',OLD_KEY='mnpData';
const CARRIERS=['docomo','au','SoftBank','楽天モバイル','ahamo','povo','LINEMO','UQ mobile','Y!mobile','IIJmio','mineo','日本通信SIM','その他'];
const PLAN_MAP={'docomo':['ドコモ MAX','ドコモ mini'],'au':['au バリューリンクプラン','au マネ活プラン','使い放題MAX'],'SoftBank':['SoftBank メリハリ無制限+','SoftBank ペイトク'],'楽天モバイル':['楽天最強プラン'],'ahamo':['ahamo'],'povo':['povo2.0'],'LINEMO':['LINEMO ベストプラン','LINEMO ベストプランV'],'UQ mobile':['UQ mobile コミコミプラン','UQ mobile トクトクプラン'],'Y!mobile':['Y!mobile シンプル2 S','Y!mobile シンプル2 M','Y!mobile シンプル2 L'],'IIJmio':['IIJmio ギガプラン'],'mineo':['mineo マイピタ'],'日本通信SIM':['日本通信SIM 合理的プラン'],'その他':[]};
const $=id=>document.getElementById(id);
let data=[],names=[],deletePending=new Map();
const headers=['ID','電話番号','MNP予約番号','契約者','利用者名','転出元キャリア','転入先キャリア','契約日','プラン','端末名','端末購入価格','端末売却価格','事務手数料等','月額料金','特典・CB','保有月数','ステータス','メモ','転出元(その他)','転入先(その他)','プラン(その他)','履歴','乗り換え元ID'];
const keys=['id','phone','reservation','holder','user','from','to','date','plan','device','purchase','sale','fee','monthly','cb','months','status','memo','fromCustom','toCustom','planCustom','history','previousId'];
const aliases={id:['id','ID'],phone:['phone','電話番号'],reservation:['reservation','mnpReservation','mnpNumber','MNP予約番号'],holder:['holder','契約者'],user:['user','利用者名'],from:['from','転出元キャリア','転出元'],to:['to','転入先キャリア','転入先'],date:['date','契約日'],plan:['plan','プラン'],device:['device','端末名'],purchase:['purchase','端末購入価格','端末購入価格（円）'],sale:['sale','端末売却価格','端末売却価格（円）'],fee:['fee','事務手数料等','手数料'],monthly:['monthly','月額料金'],cb:['cb','特典・CB','キャッシュバック'],months:['months','保有月数'],status:['status','ステータス'],memo:['memo','メモ'],fromCustom:['fromCustom','転出元(その他)'],toCustom:['toCustom','転入先(その他)'],planCustom:['planCustom','プラン(その他)'],history:['history','履歴'],previousId:['previousId','乗り換え元ID']};
function uid(){return 'mnp_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function number(v){let s=String(v??'').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/[，,]/g,'').replace(/\s/g,'');return s&&Number.isFinite(Number(s))?Number(s):0}
function normalizeInput(el){el.value=String(el.value||'').replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/[，,]/g,'').replace(/[^\d-]/g,'')}
function money(n){return '¥'+Math.round(n||0).toLocaleString('ja-JP')}
function signed(n){return (n>0?'＋':n<0?'−':'')+money(Math.abs(n))}
function profit(c){return number(c.sale)-number(c.purchase)-number(c.fee)+number(c.cb)-number(c.monthly)*number(c.months)}
function upkeep(c){return number(c.monthly)*number(c.months)}
function statusFix(s){return s==='申込中'?'契約中':['契約中','解約可能','解約済','キャンセル'].includes(s)?s:'契約中'}
function fmtPhone(s){let d=String(s||'').replace(/\D/g,'');return d.length===11&&d[0]==='0'?d.slice(0,3)+'-'+d.slice(3,7)+'-'+d.slice(7):String(s||'')}
function dateAdd(s,m){if(!s||String(m).trim()==='')return '';let d=new Date(String(s).replace(/\//g,'-')+'T12:00:00');if(Number.isNaN(+d))return '';let day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+Number(m));d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function dateLabel(s){if(!s)return '—';let d=new Date(String(s).replace(/\//g,'-')+'T12:00:00');return Number.isNaN(+d)?String(s):`${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()}`}
function normalize(raw){let c={...raw};for(const [k,as] of Object.entries(aliases)){if(c[k]===undefined||c[k]===null||c[k]===''){for(const a of as){if(raw[a]!==undefined&&raw[a]!==null&&raw[a]!==''){c[k]=raw[a];break}}}if(c[k]===undefined||c[k]===null)c[k]=''}c.id=String(c.id||uid());c.phone=fmtPhone(c.phone);c.status=statusFix(String(c.status||'契約中'));c.history=String(c.history||'');c.previousId=String(c.previousId||'');return c}
function carrier(c,k){return c[k]==='その他'&&c[k+'Custom']?c[k+'Custom']:(c[k]||'')}
function planName(c){return c.plan==='その他（直接入力）'?(c.planCustom||''):c.plan||''}
function persist(){localStorage.setItem(DATA_KEY,JSON.stringify(data));localStorage.setItem(NAMES_KEY,JSON.stringify(names))}
function msg(el,t,cls='info'){el.textContent=t;el.className='msg show '+cls}
function clearMsg(el){el.textContent='';el.className='msg'}
function init(){try{let x=JSON.parse(localStorage.getItem(DATA_KEY)||'null');if(Array.isArray(x))data=x.map(normalize);else{let old=JSON.parse(localStorage.getItem(OLD_KEY)||'[]');data=Array.isArray(old)?old.map(normalize):[];if(data.length)localStorage.setItem(DATA_KEY,JSON.stringify(data))}}catch(e){data=[]}
try{let n=JSON.parse(localStorage.getItem(NAMES_KEY)||'[]');names=Array.isArray(n)?n.map(String):[]}catch(e){names=[]}
for(const c of data){if(c.holder)names.push(c.holder);if(c.user)names.push(c.user)}names=[...new Set(names)];persist()}
function options(el,arr,val='',placeholder='選択してください'){el.replaceChildren();let p=document.createElement('option');p.value='';p.textContent=placeholder;el.append(p);for(const v of arr){let o=document.createElement('option');o.value=v;o.textContent=v;el.append(o)}if(val!==undefined)el.value=val}
function nameSelect(k,val=''){let el=$(k),custom=$(k+'New'),opts=[...new Set([...names,...data.map(c=>c[k]).filter(Boolean)])].sort((a,b)=>a.localeCompare(b,'ja'));options(el,opts);let o=document.createElement('option');o.value='__new__';o.textContent='＋新しい名前を入力';el.append(o);if(val&&opts.includes(val)){el.value=val;custom.classList.add('hidden');custom.value=''}else if(val){el.value='__new__';custom.value=val;custom.classList.remove('hidden')}else{el.value='';custom.value='';custom.classList.add('hidden')}}
function carrierSelect(k,val='',customVal=''){options($(k),CARRIERS,val);$(k+'New').value=customVal||'';$(k+'New').classList.toggle('hidden',$(k).value!=='その他');if(val&&!CARRIERS.includes(val)){ $(k).value='その他';$(k+'New').value=customVal||val;$(k+'New').classList.remove('hidden')}}
function planList(carrier,existing=''){let a=carrier?[...(PLAN_MAP[carrier]||[])]:[...new Set(Object.values(PLAN_MAP).flat())];if(carrier==='その他')a=[];if(existing&&!a.includes(existing))a.push(existing);return [...new Set(a),'その他（直接入力）']}
function refreshPlans(val='',custom=''){let car=$('to').value;options($('plan'),planList(car,val));if(val&&planList(car,val).includes(val)){$('plan').value=val;$('planNew').value=custom||'';$('planNew').classList.add('hidden')}else if(val){$('plan').value='その他（直接入力）';$('planNew').value=custom||val;$('planNew').classList.remove('hidden')}else{$('planNew').value=custom||'';$('planNew').classList.toggle('hidden',$('plan').value!=='その他（直接入力）')}}
function calc(){$('eligible').value=dateLabel(dateAdd($('date').value,$('months').value));if(!$('date').value||$('months').value.trim()==='')$('eligible').value=''}
function scrollForm(){const go=()=>window.scrollTo({top:Math.max(0,window.scrollY+$('formPanel').getBoundingClientRect().top-88),behavior:'smooth'});go();setTimeout(go,200)}
function reset(){ $('form').reset();$('editId').value='';$('prevId').value='';$('formTitle').textContent='契約を追加';$('months').value='6';nameSelect('holder');nameSelect('user');carrierSelect('from');carrierSelect('to');refreshPlans();$('rollMsg').classList.remove('show');clearMsg($('formMsg'));calc()}
function load(c){reset();$('editId').value=c.id;$('formTitle').textContent='契約を編集';$('phone').value=c.phone;$('reservation').value=c.reservation;nameSelect('holder',c.holder);nameSelect('user',c.user);carrierSelect('from',CARRIERS.includes(c.from)?c.from:(c.from?'その他':''),c.fromCustom||(CARRIERS.includes(c.from)?'':c.from));carrierSelect('to',CARRIERS.includes(c.to)?c.to:(c.to?'その他':''),c.toCustom||(CARRIERS.includes(c.to)?'':c.to));$('date').value=c.date;$('device').value=c.device;refreshPlans(c.plan,c.planCustom);for(const k of ['purchase','sale','fee','monthly','cb','months','status','memo'])$(k).value=c[k]??'';calc();scrollForm()}
function rollover(c){reset();$('phone').value=c.phone;nameSelect('holder',c.holder);nameSelect('user',c.user);carrierSelect('from',CARRIERS.includes(c.to)?c.to:'その他',CARRIERS.includes(c.to)?'':(c.toCustom||c.to));carrierSelect('to');refreshPlans();$('prevId').value=c.id;$('formTitle').textContent='乗り換え先の契約を追加';$('date').value='';$('reservation').value='';$('device').value='';for(const k of ['purchase','sale','fee','monthly','cb','memo'])$(k).value='';$('months').value='6';$('status').value='契約中';msg($('rollMsg'),`乗り換え元：${c.phone||'電話番号未登録'}。保存すると元の契約を「解約済」に変更し、履歴を記録します。`,'info');calc();scrollForm()}
function formValue(){let v=id=>$(id).value,from=v('from'),to=v('to'),pl=v('plan');return {phone:fmtPhone(v('phone').trim()),reservation:v('reservation').trim(),holder:v('holder')==='__new__'?v('holderNew').trim():v('holder'),user:v('user')==='__new__'?v('userNew').trim():v('user'),from:from==='その他'?(v('fromNew').trim()||'その他'):from,to:to==='その他'?(v('toNew').trim()||'その他'):to,date:v('date'),plan:pl==='その他（直接入力）'?v('planNew').trim():pl,device:v('device').trim(),purchase:v('purchase').trim(),sale:v('sale').trim(),fee:v('fee').trim(),monthly:v('monthly').trim(),cb:v('cb').trim(),months:v('months').trim(),status:statusFix(v('status')),memo:v('memo').trim(),fromCustom:from==='その他'?v('fromNew').trim():'',toCustom:to==='その他'?v('toNew').trim():'',planCustom:pl==='その他（直接入力）'?v('planNew').trim():''}}
function save(e){e.preventDefault();clearMsg($('formMsg'));let v=formValue(),id=$('editId').value,prev=$('prevId').value;if(!v.phone&&!v.holder&&!v.reservation){msg($('formMsg'),'電話番号・契約者・MNP予約番号のいずれかを入力してください。','error');return}
for(const n of [v.holder,v.user])if(n&&!names.includes(n))names.push(n);
if(id){let i=data.findIndex(c=>c.id===id);if(i<0){msg($('formMsg'),'編集対象が見つかりません。','error');return}data[i]={...data[i],...v,id}}
else{let rec={...v,id:uid(),previousId:prev||'',history:''};if(prev){let old=data.find(c=>c.id===prev);if(old){let today=new Date().toLocaleDateString('ja-JP');old.status='解約済';old.history=[old.history,`${today} 乗り換えにより解約済に変更（新契約：${carrier(rec,'to')} ${planName(rec)}）`].filter(Boolean).join('\n');rec.history=`${today} 乗り換え元：${carrier(old,'to')} ${planName(old)}（契約日：${dateLabel(old.date)}、端末：${old.device||'未登録'}）`}}data.push(rec)}
persist();render();reset();msg($('globalMsg'),id?'契約を更新しました。':'契約を保存しました。','ok');}
function currentList(){return data.filter(c=>!data.some(n=>n.previousId===c.id))}
function renderDash(){let list=currentList(),total=data.reduce((s,c)=>s+profit(c),0);$('count').textContent=list.length;$('totalProfit').textContent=signed(total);$('totalProfit').className=total>=0?'positive':'negative';$('active').textContent=list.filter(c=>c.status==='契約中').length;$('eligibleCount').textContent=list.filter(c=>['解約可能','解約済'].includes(c.status)).length}
function detail(k,v,wide=false){return `<div class="detail${wide?' wide':''}"><small>${esc(k)}</small><div>${esc(v||'—')}</div></div>`}
function matches(c,q){return !q||[c.phone,c.reservation,c.holder,c.user,carrier(c,'from'),carrier(c,'to'),c.fromCustom,c.toCustom,planName(c),c.device,c.memo,c.history].join(' ').toLowerCase().includes(q.toLowerCase())}
function renderCards(){let q=$('search').value.trim();let list=currentList().filter(c=>(matches(c,q)||chain(c).some(old=>matches(old,q)))&&(!$('filter').value||c.status===$('filter').value)),host=$('cards');host.replaceChildren();if(!list.length){host.innerHTML='<div class="empty">該当する契約はありません。</div>';return}
for(const c of list){let p=profit(c),card=document.createElement('article');card.className='contract';let canRoll=!['解約済','キャンセル'].includes(c.status),hasHist=!!c.previousId,del=deletePending.has(c.id);card.innerHTML=`<div class="top"><div class="phone">${esc(c.phone||'電話番号未登録')}</div><span class="status">${esc(c.status)}</span></div><div class="profit ${p>=0?'positive':'negative'}">${esc(signed(p))}</div><div class="details">
${detail('契約者',c.holder)}${detail('利用者',c.user)}
${detail('転出元 → 転入先',`${carrier(c,'from')||'—'} → ${carrier(c,'to')||'—'}`,true)}
${detail('契約日',dateLabel(c.date))}${detail('MNP予約番号',c.reservation)}
${detail('端末',c.device)}${detail('プラン',planName(c))}
${detail('解約可能日（目安）',dateLabel(dateAdd(c.date,c.months)))}${detail('保有月数',c.months?c.months+'か月':'')}
${detail('購入価格',money(number(c.purchase)))}${detail('売却価格',money(number(c.sale)))}
${detail('特典・CB',money(number(c.cb)))}${detail('維持費',money(upkeep(c)))}
${detail('手数料等',money(number(c.fee)))}${detail('月額料金',money(number(c.monthly)))}
${detail('メモ',c.memo,true)}${c.history?detail('履歴',c.history,true):''}</div>
<div class="cardactions"><button class="small" data-act="edit" data-id="${esc(c.id)}">編集</button>${canRoll?`<button class="small" data-act="roll" data-id="${esc(c.id)}">乗り換え</button>`:''}${hasHist?`<button class="small" data-act="history" data-id="${esc(c.id)}">履歴</button>`:''}<button class="small danger" data-act="delete" data-id="${esc(c.id)}">${del?'もう一度押すと削除':'削除'}</button></div>`;host.append(card)}}
function renderNames(){let host=$('namesList');host.replaceChildren();if(!names.length){host.textContent='登録された名前はありません。';return}for(const n of names){let count=data.reduce((s,c)=>s+(c.holder===n?1:0)+(c.user===n?1:0),0),row=document.createElement('div');row.className='nameitem';row.innerHTML=`<div><input aria-label="名前" value="${esc(n)}" data-old="${esc(n)}"><small class="notice">使用数：${count}件</small></div><div class="actions" style="margin:0"><button class="small" data-nameact="rename" data-name="${esc(n)}">変更</button><button class="small danger" data-nameact="delete" data-name="${esc(n)}">削除</button></div>`;host.append(row)}}
function render(){renderDash();renderCards();renderNames()}
function deleteItem(id){if(!deletePending.has(id)){let t=setTimeout(()=>{deletePending.delete(id);renderCards()},4000);deletePending.set(id,t);renderCards();return}clearTimeout(deletePending.get(id));deletePending.delete(id);let doomed=new Set([id]),again=true;while(again){again=false;for(const c of data)if(c.previousId&&doomed.has(c.previousId)&&!doomed.has(c.id)){doomed.add(c.id);again=true}}let removed=data.filter(c=>doomed.has(c.id)),parentIds=removed.map(c=>c.previousId).filter(Boolean);data=data.filter(c=>!doomed.has(c.id));for(const pid of parentIds){let p=data.find(c=>c.id===pid);if(p&&!data.some(c=>c.previousId===p.id)){p.history=p.history.split('\n').filter(x=>!x.includes('乗り換えにより解約済に変更')).join('\n');if(p.status==='解約済')p.status='契約中'}}persist();render();msg($('globalMsg'),'契約を削除しました。','ok')}
function chain(c){let a=[c],seen=new Set([c.id]),cur=c;while(cur.previousId){let p=data.find(x=>x.id===cur.previousId);if(!p||seen.has(p.id))break;a.unshift(p);seen.add(p.id);cur=p}return a}
function historyView(c){let a=chain(c),total=a.reduce((s,x)=>s+profit(x),0);$('historyContent').innerHTML=`<div class="historyitem"><strong>電話番号：</strong>${esc(c.phone||'未登録')}<br><strong>履歴全体の利益：</strong><span class="${total>=0?'positive':'negative'}">${esc(signed(total))}</span></div>`+a.map((x,i)=>`<div class="historyitem"><h3>${i+1}. ${esc(carrier(x,'from')||'—')} → ${esc(carrier(x,'to')||'—')}</h3><div class="details">
${detail('ステータス',x.status)}${detail('利益',signed(profit(x)))}
${detail('契約日',dateLabel(x.date))}${detail('プラン',planName(x))}
${detail('端末',x.device)}${detail('MNP予約番号',x.reservation)}
${detail('保有月数',x.months?x.months+'か月':'')}${detail('解約可能日（目安）',dateLabel(dateAdd(x.date,x.months)))}
${detail('購入価格',money(number(x.purchase)))}${detail('売却価格',money(number(x.sale)))}
${detail('CB',money(number(x.cb)))}${detail('維持費',money(upkeep(x)))}
${detail('メモ',x.memo,true)}${detail('履歴',x.history,true)}</div></div>`).join('');$('historyPanel').classList.remove('hidden');$('historyPanel').scrollIntoView({behavior:'smooth',block:'start'})}
function csvCell(v){let s=String(v??'');return /[",\r\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}
function exportCSV(){let rows=[headers,...data.map(c=>keys.map(k=>k==='status'?statusFix(c[k]):c[k]??''))],csv='\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n'),blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='mnp_manager_'+new Date().toISOString().slice(0,10)+'.csv';document.body.append(a);a.click();a.remove();URL.revokeObjectURL(url);msg($('globalMsg'),'CSVを出力しました。','ok')}
function parseCSV(t){t=t.replace(/^\ufeff/,'');let rows=[],row=[],cell='',q=false;for(let i=0;i<t.length;i++){let ch=t[i];if(q){if(ch==='"'&&t[i+1]==='"'){cell+='"';i++}else if(ch==='"')q=false;else cell+=ch}else if(ch==='"')q=true;else if(ch===','){row.push(cell);cell=''}else if(ch==='\n'){row.push(cell);rows.push(row);row=[];cell=''}else if(ch!=='\r')cell+=ch}row.push(cell);if(row.some(x=>x!==''))rows.push(row);return rows}
function importFile(file){let r=new FileReader();r.onload=()=>{try{let rows=parseCSV(String(r.result||''));if(rows.length<2){msg($('globalMsg'),'CSVにデータがありません。','error');return}let h=rows[0].map(x=>x.trim()),existing=new Set(data.map(c=>c.id)),added=0,dups=0;for(let row of rows.slice(1)){if(!row.some(x=>x!==''))continue;let raw={};h.forEach((head,i)=>{let idx=headers.indexOf(head);let key=idx>=0?keys[idx]:head;if(aliases[key])raw[key]=row[i]??''});let c=normalize(raw);if(existing.has(c.id)){dups++;continue}if(!c.id)c.id=uid();data.push(c);existing.add(c.id);for(const n of [c.holder,c.user])if(n&&!names.includes(n))names.push(n);added++}persist();render();msg($('globalMsg'),`${added}件追加（重複${dups}件）`,'ok')}catch(e){msg($('globalMsg'),'CSVの読み込みに失敗しました。形式を確認してください。','error')}finally{$('csvFile').value=''}};r.onerror=()=>msg($('globalMsg'),'CSVを読み込めませんでした。','error');r.readAsText(file,'utf-8')}
function importClick(){$('csvFile').click()}
$('form').addEventListener('submit',save);$('clearForm').addEventListener('click',reset);
for(const id of ['date','months'])$(id).addEventListener('input',calc);
for(const id of ['purchase','sale','fee','monthly','cb','months'])for(const ev of ['input','change','keyup','blur'])$(id).addEventListener(ev,()=>{normalizeInput($(id));calc()});

$('search').addEventListener('input',renderCards);$('filter').addEventListener('change',renderCards);
$('cards').addEventListener('click',e=>{let b=e.target.closest('button[data-act]');if(!b)return;let c=data.find(x=>x.id===b.dataset.id);if(!c)return;if(b.dataset.act==='edit')load(c);if(b.dataset.act==='roll')rollover(c);if(b.dataset.act==='history')historyView(c);if(b.dataset.act==='delete')deleteItem(c.id)});
$('closeHistory').addEventListener('click',()=>$('historyPanel').classList.add('hidden'));
for(const id of ['exportTop','exportBottom'])$(id).addEventListener('click',exportCSV);for(const id of ['importTop','importBottom'])$(id).addEventListener('click',importClick);$('csvFile').addEventListener('change',e=>{if(e.target.files?.[0])importFile(e.target.files[0])});
$('namesBtn').addEventListener('click',()=>$('namesPanel').classList.toggle('hidden'));$('closeNames').addEventListener('click',()=>$('namesPanel').classList.add('hidden'));
$('namesList').addEventListener('click',e=>{let b=e.target.closest('button[data-nameact]');if(!b)return;let old=b.dataset.name;if(b.dataset.nameact==='delete'){if(data.some(c=>c.holder===old||c.user===old)){msg($('namesMsg'),'契約で使用中の名前は削除できません。','error');return}names=names.filter(n=>n!==old);persist();render();msg($('namesMsg'),'名前を削除しました。','ok')}else{let input=b.closest('.nameitem').querySelector('input'),v=input.value.trim();if(!v){msg($('namesMsg'),'新しい名前を入力してください。','error');return}data.forEach(c=>{if(c.holder===old)c.holder=v;if(c.user===old)c.user=v});names=[...new Set(names.map(n=>n===old?v:n))];persist();render();msg($('namesMsg'),'名前を変更しました。','ok')}});
