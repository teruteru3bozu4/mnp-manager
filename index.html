<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172554"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>MNP管理</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f5f9;color:#0f172a;font-family:system-ui,sans-serif}header{background:#172554;color:white;padding:18px;position:sticky;top:0}h1{font-size:21px;margin:0}main{max-width:850px;margin:auto;padding:12px 10px 70px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.box,section,.record{background:white;border:1px solid #e2e8f0;border-radius:13px;padding:13px;margin-bottom:12px}.stats .box{margin:0 0 12px}.label,.small{font-size:12px;color:#64748b}.value{font-size:20px;font-weight:800;margin-top:4px}h2{font-size:16px;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-size:12px;font-weight:650}input,select,textarea{display:block;width:100%;min-width:0;margin-top:5px;padding:11px 9px;border:1px solid #cbd5e1;border-radius:9px;background:white;font:inherit;font-size:16px}textarea{min-height:70px}.full{grid-column:1/-1}button{border:0;border-radius:9px;padding:11px 12px;font:inherit;font-weight:700}.primary{background:#2563eb;color:white}.secondary{background:#e2e8f0}.danger{background:#fee2e2;color:#991b1b}.actions{display:flex;gap:8px;margin-top:12px}.actions button{flex:1}.toolbar{display:flex;gap:8px;margin-bottom:10px}.toolbar>*{flex:1;min-width:0}.record h3{font-size:15px;margin:0 0 5px}.recordtop{display:flex;justify-content:space-between;gap:8px}.badge{font-size:11px;background:#e2e8f0;padding:4px 8px;border-radius:30px;white-space:nowrap}.profit{font-size:20px;font-weight:800;margin:9px 0}.pos{color:#15803d}.neg{color:#b91c1c}.details{display:grid;grid-template-columns:1fr 1fr;gap:7px;font-size:12px;color:#64748b}.details b{color:#0f172a}.empty{text-align:center;color:#64748b;padding:24px}.note{font-size:11px;color:#64748b;line-height:1.5}.plan-list{display:grid;gap:7px}.plan-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px;border:1px solid #e2e8f0;border-radius:8px}.plan-item span{overflow-wrap:anywhere}.plan-item button{padding:7px 10px}footer{text-align:center;font-size:11px;color:#64748b;padding:8px}@media(min-width:650px){.stats{grid-template-columns:repeat(4,1fr)}.grid{grid-template-columns:repeat(3,1fr)}}
</style></head><body><header><h1>📱 MNP管理</h1><div class="small" style="color:#cbd5e1">契約・端末売買・維持費・利益の管理</div></header><main>
<div class="stats"><div class="box"><div class="label">登録件数</div><div class="value" id="count">0件</div></div><div class="box"><div class="label">合計損益</div><div class="value" id="total">¥0</div></div><div class="box"><div class="label">契約中</div><div class="value" id="active">0件</div></div><div class="box"><div class="label">解約可能・解約済</div><div class="value" id="eligibleCount">0件</div></div></div>
<section id="formPanel"><h2 id="formTitle">契約を登録</h2><form id="form"><input id="editId" type="hidden"><div class="grid">
<label>電話番号<input id="phone" inputmode="tel" placeholder="090-1234-5678"></label><label>契約者<input id="holder"></label><label>利用者名<input id="user"></label><label>転出元キャリア<select id="from"><option value="">選択してください</option><option>ドコモ</option><option>au</option><option>ソフトバンク</option><option>楽天モバイル</option><option>UQ mobile</option><option>ワイモバイル</option><option>LINEMO</option><option>povo</option><option>ahamo</option></select></label><label>転入先キャリア<select id="to"><option value="">選択してください</option><option>ドコモ</option><option>au</option><option>ソフトバンク</option><option>楽天モバイル</option><option>UQ mobile</option><option>ワイモバイル</option><option>LINEMO</option><option>povo</option><option>ahamo</option></select></label><label>契約日<input id="date" type="date"></label><label>プラン<select id="plan"><option value="">先に転入先キャリアを選択</option></select></label><label>端末<input id="device"></label><label>端末購入価格（円）<input id="purchase" type="number" min="0" value="0"></label><label>端末売却価格（円）<input id="sale" type="number" min="0" value="0"></label><label>事務手数料等（円）<input id="fee" type="number" min="0" value="0"></label><label>月額料金（円）<input id="monthly" type="number" min="0" value="0"></label><label>特典・CB（円）<input id="cb" type="number" min="0" value="0"></label><label>保有月数<input id="months" type="number" min="0" value="6"></label><label>解約可能予定日<input id="eligibleDate" readonly placeholder="自動計算"></label><label>ステータス<select id="status"><option>契約中</option><option>解約可能</option><option>解約済</option><option>申込中</option><option>キャンセル</option></select></label><label class="full">メモ<textarea id="memo"></textarea></label></div><div class="actions"><button class="primary" type="submit" id="save">登録する</button><button class="secondary" type="button" id="clear">入力クリア</button></div><p class="note">損益＝売却価格－購入価格－事務手数料＋特典・CB－（月額料金×保有月数）</p></form></section>
<section id="planSettings"><h2>料金プラン設定</h2><p class="note">転入先キャリアに表示するプランを管理できます。初期候補は代表例です。申込受付状況は各社公式サイトで確認してください。</p><div class="grid"><label class="full">設定するキャリア<select id="planCarrier"><option>ドコモ</option><option>au</option><option>ソフトバンク</option><option>楽天モバイル</option><option>UQ mobile</option><option>ワイモバイル</option><option>LINEMO</option><option>povo</option><option>ahamo</option></select></label><label class="full">追加するプラン名<input id="newPlan" placeholder="例：自分で管理するプラン名"></label></div><div class="actions"><button type="button" class="primary" id="addPlan">プランを追加</button></div><div id="planList" class="plan-list"></div></section><section><h2>登録データ</h2><div class="toolbar"><input id="search" placeholder="番号・名前・キャリアで検索"><select id="filter"><option value="">すべて</option><option>申込中</option><option>契約中</option><option>解約可能</option><option>解約済</option><option>キャンセル</option></select></div><div class="actions" style="margin-top:0"><button class="secondary" id="export">CSVを書き出す</button><button class="secondary" id="import">CSVを読み込む</button><input type="file" id="file" accept=".csv" hidden></div><div id="records"></div></section><footer>データはこの端末のブラウザ内に保存されます。定期的にCSVバックアップしてください。</footer></main>
<script>
const $=id=>document.getElementById(id), keys=['phone','holder','user','from','to','date','plan','device','purchase','sale','fee','monthly','cb','months','status','memo'], labels=['電話番号','契約者','利用者名','転出元キャリア','転入先キャリア','契約日','プラン','端末','端末購入価格','端末売却価格','事務手数料等','月額料金','特典・CB','保有月数','ステータス','メモ'];let data=[];try{data=JSON.parse(localStorage.getItem('mnpData')||'[]')}catch(e){}
const carriers=['ドコモ','au','ソフトバンク','楽天モバイル','UQ mobile','ワイモバイル','LINEMO','povo','ahamo'];
const defaultPlans={
'ドコモ':['ドコモ MAX','ドコモ ポイ活 MAX','ドコモ ポイ活 20','ドコモ mini','eximo（既存契約）','irumo（既存契約）'],
'au':['au バリューリンクプラン','au マネ活バリューリンクプラン','使い放題MAX＋','スマホミニプラン＋'],
'ソフトバンク':['ペイトク2','テイガク無制限','ミニフィット2','スマホデビュープラン＋'],
'楽天モバイル':['Rakuten最強プラン','Rakuten最強U-NEXT'],
'UQ mobile':['コミコミプランバリュー','トクトクプラン2','ミニミニプラン（既存契約）'],
'ワイモバイル':['シンプル3 S','シンプル3 M','シンプル3 L','シンプル2 S（既存契約）','シンプル2 M（既存契約）','シンプル2 L（既存契約）'],
'LINEMO':['LINEMOベストプラン','LINEMOベストプランV'],
'povo':['povo2.0'],
'ahamo':['ahamo','ahamo大盛り']
};
let planOptions;try{const savedPlans=JSON.parse(localStorage.getItem('mnpPlanOptions')||'null');planOptions=savedPlans&&typeof savedPlans==='object'?savedPlans:JSON.parse(JSON.stringify(defaultPlans))}catch(e){planOptions=JSON.parse(JSON.stringify(defaultPlans))}
carriers.forEach(c=>{if(!Array.isArray(planOptions[c]))planOptions[c]=defaultPlans[c].slice()});
function persistPlans(){localStorage.setItem('mnpPlanOptions',JSON.stringify(planOptions));refreshPlanSelect($('plan').value);renderPlanSettings()}
function refreshPlanSelect(current=''){const sel=$('plan');sel.innerHTML='';const blank=document.createElement('option');blank.value='';blank.textContent=$('to').value?'プランを選択してください':'先に転入先キャリアを選択';sel.appendChild(blank);(planOptions[$('to').value]||[]).forEach(p=>{const o=document.createElement('option');o.value=p;o.textContent=p;sel.appendChild(o)});if(current&&!(planOptions[$('to').value]||[]).includes(current)){const o=document.createElement('option');o.value=current;o.textContent=current+'（既存データ）';sel.appendChild(o)}sel.value=current||''}
function setSelectValue(id,value){const sel=$(id);if(value&&!Array.from(sel.options).some(o=>o.value===value)){const o=document.createElement('option');o.value=value;o.textContent=value+'（既存データ）';sel.appendChild(o)}sel.value=value||''}
function renderPlanSettings(){const box=$('planList');if(!box)return;box.innerHTML='';const c=$('planCarrier').value;(planOptions[c]||[]).forEach((p,i)=>{const row=document.createElement('div');row.className='plan-item';const name=document.createElement('span');name.textContent=p;const del=document.createElement('button');del.type='button';del.className='danger';del.textContent='削除';del.addEventListener('click',()=>{if(confirm('「'+p+'」をプラン候補から削除しますか？\n既存の契約データに保存されたプラン名は削除されません。')){planOptions[c].splice(i,1);persistPlans()}});row.append(name,del);box.appendChild(row)});if(!box.children.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='登録プランがありません。下の欄から追加してください。';box.appendChild(empty)}}
$('to').addEventListener('change',()=>refreshPlanSelect(''));$('planCarrier').addEventListener('change',renderPlanSettings);$('addPlan').addEventListener('click',()=>{const c=$('planCarrier').value,p=$('newPlan').value.trim();if(!p){alert('追加するプラン名を入力してください');return}if(planOptions[c].includes(p)){alert('このプランは登録済みです');return}planOptions[c].push(p);$('newPlan').value='';persistPlans()});
const money=n=>'¥'+Math.round(+n||0).toLocaleString('ja-JP'), prof=x=>(+x.sale||0)-(+x.purchase||0)-(+x.fee||0)+(+x.cb||0)-((+x.monthly||0)*(+x.months||0));
function addMonths(s,n){if(!s)return '';let d=new Date(s+'T12:00:00'),day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+(+n||0));d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dateCalc(){$('eligibleDate').value=addMonths($('date').value,$('months').value)}$('date').onchange=dateCalc;$('months').oninput=dateCalc;
$('phone').oninput=e=>{let v=e.target.value.replace(/\D/g,'').slice(0,11);e.target.value=v.length===11?v.slice(0,3)+'-'+v.slice(3,7)+'-'+v.slice(7):v};
function saveData(){localStorage.setItem('mnpData',JSON.stringify(data));render()}
function clearForm(){$('form').reset();$('editId').value='';['purchase','sale','fee','monthly','cb'].forEach(k=>$(k).value=0);$('months').value=6;$('status').value='契約中';$('formTitle').textContent='契約を登録';$('save').textContent='登録する';refreshPlanSelect('');dateCalc()}$('clear').onclick=clearForm;
$('form').onsubmit=e=>{e.preventDefault();let x={id:$('editId').value||String(Date.now())};keys.forEach(k=>x[k]=$(k).value.trim());x.eligibleDate=addMonths(x.date,x.months);let i=data.findIndex(y=>y.id===x.id);if(i>=0)data[i]=x;else data.unshift(x);saveData();clearForm()};
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){let sum=data.reduce((a,x)=>a+prof(x),0);$('count').textContent=data.length+'件';$('total').textContent=money(sum);$('total').className='value '+(sum>=0?'pos':'neg');$('active').textContent=data.filter(x=>x.status==='契約中').length+'件';$('eligibleCount').textContent=data.filter(x=>['解約可能','解約済'].includes(x.status)).length+'件';let q=$('search').value.toLowerCase(),f=$('filter').value,arr=data.filter(x=>(!f||x.status===f)&&(!q||keys.some(k=>String(x[k]||'').toLowerCase().includes(q))));$('records').innerHTML=arr.length?arr.map(x=>`<article class="record"><div class="recordtop"><div><h3>${esc(x.phone||'番号未登録')} ${esc(x.holder||'')}</h3><div class="small">${esc(x.from||'未設定')} → ${esc(x.to||'未設定')}　${esc(x.date||'')}</div></div><span class="badge">${esc(x.status)}</span></div><div class="profit ${prof(x)>=0?'pos':'neg'}">${money(prof(x))}</div><div class="details"><div>利用者：<b>${esc(x.user||'—')}</b></div><div>端末：<b>${esc(x.device||'—')}</b></div><div>プラン：<b>${esc(x.plan||'—')}</b></div><div>解約可能日：<b>${esc(x.eligibleDate||'—')}</b></div><div>購入：<b>${money(x.purchase)}</b></div><div>売却：<b>${money(x.sale)}</b></div><div>特典：<b>${money(x.cb)}</b></div><div>維持費：<b>${money((+x.monthly||0)*(+x.months||0))}</b></div>${x.memo?`<div style="grid-column:1/-1">メモ：<b>${esc(x.memo)}</b></div>`:''}</div><div class="actions"><button class="secondary" onclick="editItem('${x.id}')">編集</button><button class="danger" onclick="delItem('${x.id}')">削除</button></div></article>`).join(''):'<div class="empty">登録データがありません</div>'}
function editItem(id){let x=data.find(y=>y.id===id);keys.filter(k=>!['from','to','plan'].includes(k)).forEach(k=>$(k).value=x[k]||'');setSelectValue('from',x.from);setSelectValue('to',x.to);refreshPlanSelect(x.plan||'');$('editId').value=x.id;$('formTitle').textContent='契約を編集';$('save').textContent='変更を保存';dateCalc();$('formPanel').scrollIntoView({behavior:'smooth'})}function delItem(id){if(confirm('このデータを削除しますか？')){data=data.filter(x=>x.id!==id);saveData()}}window.editItem=editItem;window.delItem=delItem;
$('search').oninput=render;$('filter').onchange=render;
function cell(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}$('export').onclick=()=>{let rows=[['ID',...labels,'解約可能予定日'],...data.map(x=>[x.id,...keys.map(k=>x[k]),x.eligibleDate||addMonths(x.date,x.months)])];let blob=new Blob(['\ufeff'+rows.map(r=>r.map(cell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='MNP管理.csv';a.click();URL.revokeObjectURL(a.href)};
$('import').onclick=()=>$('file').click();function parseCSV(s){let out=[],row=[],v='',q=false;for(let i=0;i<s.length;i++){let c=s[i];if(q){if(c==='"'&&s[i+1]==='"'){v+='"';i++}else if(c==='"')q=false;else v+=c}else if(c==='"')q=true;else if(c===','){row.push(v);v=''}else if(c==='\n'){row.push(v.replace(/\r$/,''));out.push(row);row=[];v=''}else v+=c}if(v||row.length){row.push(v);out.push(row)}return out}
$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let rows=parseCSV((await f.text()).replace(/^\ufeff/,'')),h=rows[0],idx=h.indexOf('ID'),col=labels.map(x=>h.indexOf(x));let arr=rows.slice(1).filter(r=>r.some(Boolean)).map(r=>{let x={id:idx>=0&&r[idx]?r[idx]:String(Date.now()+Math.random())};keys.forEach((k,i)=>x[k]=col[i]>=0?r[col[i]]||'':'');x.eligibleDate=addMonths(x.date,x.months);return x});if(confirm(arr.length+'件を読み込みます。既存データに追加しますか？')){let ids=new Set(data.map(x=>x.id));arr.forEach(x=>{if(!ids.has(x.id))data.push(x)});saveData();alert('読み込みました')}}catch(e){alert('CSVを読み込めません。アプリから書き出したCSVを選んでください')}e.target.value=''};
clearForm();renderPlanSettings();render();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
